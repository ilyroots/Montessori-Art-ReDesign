<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Mixing Atelier — Nature of Art</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#FAF7EF',
            paper: '#FFFFFF',
            canvas: '#F4EEDC',
            ink: '#1C1B18',
            charcoal: '#3D3A34',
            honey: '#D89A27',
            'bee-yellow': '#F2D300',
            'creative-pink': '#E91E8F',
            'kids-blue': '#44C9D4',
            sage: '#A7B89A',
            linen: '#E5DDD0',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Outfit"', 'system-ui', 'sans-serif'],
            hand: ['"Caveat"', 'cursive'],
          },
        }
      }
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #FAF7EF;
      overflow-x: hidden;
    }
    .paint-blob {
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .paint-blob:hover {
      transform: scale(1.08);
    }
    .paint-blob:active {
      transform: scale(0.95);
    }
    .mixing-palette {
      transition: background-color 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .drop-anim {
      animation: dropIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes dropIn {
      0% { transform: translateY(-30px) scale(0); opacity: 0; }
      60% { transform: translateY(5px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(3%, 35%); }
      90% { transform: translate(-10%, 10%); }
    }
    .grain-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      animation: grain 8s steps(10) infinite;
    }
    .color-dot {
      box-shadow: 0 0 0 4px rgba(255,255,255,0.8), 0 8px 24px rgba(0,0,0,0.12);
    }
    .swatch-ripple {
      position: relative;
      overflow: hidden;
    }
    .swatch-ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center, rgba(255,255,255,0.4) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.3s, transform 0.5s;
    }
    .swatch-ripple:active::after {
      opacity: 1;
      transform: scale(2);
      transition: 0s;
    }
    .gradient-mesh {
      background:
        radial-gradient(ellipse at 0% 0%, rgba(216, 154, 39, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 0%, rgba(242, 211, 0, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(233, 30, 143, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, rgba(68, 201, 212, 0.08) 0%, transparent 50%);
    }
    .tip-card {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
    }
    .tip-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(28, 27, 24, 0.1);
    }
  </style>
</head>
<body class="min-h-screen bg-ivory text-ink">
  <div id="root"></div>

  <script type="module">
    import { h, render, Component } from 'https://esm.sh/preact@10';
    import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10/hooks';
    import htm from 'https://esm.sh/htm@3';

    const html = htm.bind(h);

    // Color utilities
    const PRIMARY_COLORS = {
      red: { name: 'Red', hex: '#E53935', rgb: [229, 57, 53] },
      yellow: { name: 'Yellow', hex: '#FDD835', rgb: [253, 216, 53] },
      blue: { name: 'Blue', hex: '#1E88E5', rgb: [30, 136, 229] },
    };

    const SECONDARY_NAMES = {
      'red+yellow': 'Orange',
      'yellow+red': 'Orange',
      'yellow+blue': 'Green',
      'blue+yellow': 'Green',
      'red+blue': 'Purple',
      'blue+red': 'Purple',
    };

    function mixColors(drops) {
      const total = Object.values(drops).reduce((a, b) => a + b, 0);
      if (total === 0) return { hex: '#FAF7EF', name: 'Empty Palette', rgb: [250, 247, 239] };

      let r = 0, g = 0, b = 0;
      Object.entries(drops).forEach(([color, count]) => {
        const rgb = PRIMARY_COLORS[color].rgb;
        r += rgb[0] * count;
        g += rgb[1] * count;
        b += rgb[2] * count;
      });

      r = Math.round(r / total);
      g = Math.round(g / total);
      b = Math.round(b / total);

      const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');

      // Determine name
      const active = Object.entries(drops).filter(([_, c]) => c > 0).map(([k]) => k);
      let name = 'Mixed Color';
      if (active.length === 1) {
        name = PRIMARY_COLORS[active[0]].name;
      } else if (active.length === 2) {
        const key = active.sort().join('+');
        name = SECONDARY_NAMES[key] || 'Custom Mix';
      } else if (active.length === 3) {
        name = 'Brown (Tertiary)';
      }

      return { hex, name, rgb: [r, g, b] };
    }

    function getContrastColor([r, g, b]) {
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 128 ? '#1C1B18' : '#FAF7EF';
    }

    // Components
    function Header() {
      return html`
        <header class="relative px-6 py-6">
          <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-honey flex items-center justify-center text-white font-serif text-lg font-bold">N</div>
              <div>
                <h1 class="font-serif text-lg font-semibold text-ink leading-tight">Nature of Art</h1>
                <p class="text-[10px] uppercase tracking-[0.2em] text-charcoal/50 font-medium">Montessori Color Atelier</p>
              </div>
            </div>
            <div class="hidden sm:flex items-center gap-1.5 text-xs text-charcoal/60">
              <span class="w-2 h-2 rounded-full bg-sage"></span>
              Interactive Demo
            </div>
          </div>
        </header>
      `;
    }

    function Hero() {
      return html`
        <div class="relative text-center px-6 pt-8 pb-4">
          <div class="max-w-2xl mx-auto">
            <p class="text-xs uppercase tracking-[0.15em] text-honey font-semibold mb-3">Montessori Art Education</p>
            <h2 class="font-serif text-4xl sm:text-5xl font-semibold text-ink tracking-[-0.02em] mb-4 leading-[1.1]">
              Discover Color<br/>Through <span class="text-honey italic">Mixing</span>
            </h2>
            <p class="text-charcoal/70 text-base max-w-md mx-auto leading-relaxed">
              In the Montessori atelier, children learn that red, yellow, and blue hold infinite possibilities. 
              Explore color theory through hands-on mixing.
            </p>
          </div>
        </div>
      `;
    }

    function ColorBlob({ color, name, hex, count, onClick, delay }) {
      return html`
        <button
          onClick=${onClick}
          class="group relative flex flex-col items-center gap-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-honey focus-visible:ring-offset-2 rounded-2xl"
          style="animation: float ${5 + delay}s ease-in-out ${delay * 0.3}s infinite"
        >
          <div class="relative">
            <div 
              class="paint-blob w-20 h-20 sm:w-24 sm:h-24 rounded-full color-dot swatch-ripple cursor-pointer"
              style="background: ${hex};"
            ></div>
            ${count > 0 && html`
              <div class="absolute -top-1 -right-1 w-7 h-7 rounded-full bg-paper border-2 border-linen flex items-center justify-center text-xs font-bold text-ink shadow-sm">
                ${count}
              </div>
            `}
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity">
              <div class="bg-ink text-paper text-[10px] font-semibold px-2 py-1 rounded-full whitespace-nowrap">
                Add ${name}
              </div>
            </div>
          </div>
          <span class="text-sm font-medium text-charcoal">${name}</span>
        </button>
      `;
    }

    function MixingPalette({ mixedColor, drops, onReset }) {
      const [ripples, setRipples] = useState([]);
      const paletteRef = useRef();

      const addRipple = useCallback((e) => {
        const rect = paletteRef.current?.getBoundingClientRect();
        if (!rect) return;
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const id = Date.now();
        setRipples(prev => [...prev.slice(-4), { id, x, y }]);
        setTimeout(() => setRipples(prev => prev.filter(r => r.id !== id)), 1000);
      }, []);

      return html`
        <div class="relative flex flex-col items-center">
          <div class="relative mb-6">
            <div
              ref=${paletteRef}
              onClick=${addRipple}
              class="mixing-palette w-48 h-48 sm:w-56 sm:h-56 rounded-full border-4 border-paper shadow-dramatic cursor-pointer relative overflow-hidden grain-overlay"
              style="background: ${mixedColor.hex}; box-shadow: 0 24px 64px ${mixedColor.hex}33, 0 8px 24px rgba(0,0,0,0.1);"
            >
              ${ripples.map(r => html`
                <div
                  key=${r.id}
                  class="absolute rounded-full bg-white/30 pointer-events-none"
                  style="
                    left: ${r.x}px; top: ${r.y}px;
                    width: 10px; height: 10px;
                    transform: translate(-50%, -50%);
                    animation: ripple 1s ease-out forwards;
                  "
                />
              `)}
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                <p 
                  class="font-serif text-2xl sm:text-3xl font-semibold mb-1"
                  style="color: ${getContrastColor(mixedColor.rgb)};"
                >
                  ${mixedColor.name}
                </p>
                <p 
                  class="text-xs font-mono opacity-70"
                  style="color: ${getContrastColor(mixedColor.rgb)};"
                >
                  ${mixedColor.hex.toUpperCase()}
                </p>
              </div>
            </div>
            
            <!-- Paint brush icon -->
            <div class="absolute -right-4 -bottom-2 w-12 h-12 bg-paper rounded-full shadow-card flex items-center justify-center border border-linen">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-honey">
                <path d="M18 3c-1.5 0-3.5 2-5 3.5C11.5 8 10 9.5 10 11s1.5 3 3 3 3-1.5 3-3c0-1.5-1.5-3-3.5-4.5C10 5 8 3 6.5 3S3 4.5 3 6.5c0 2 1.5 3.5 3.5 5C8.5 13 10 14.5 10 16s-1 3-3 3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <button
              onClick=${onReset}
              class="text-xs font-medium text-charcoal/60 hover:text-honey transition-colors px-3 py-1.5 rounded-full border border-linen hover:border-honey/30"
            >
              Clear Palette
            </button>
          </div>

          <!-- Drop indicators -->
          <div class="flex gap-2 mt-4 flex-wrap justify-center max-w-xs">
            ${Object.entries(drops).filter(([_, c]) => c > 0).map(([color, count]) => html`
              <div key=${color} class="flex items-center gap-1 bg-paper border border-linen rounded-full px-2.5 py-1">
                <div class="w-3 h-3 rounded-full" style="background: ${PRIMARY_COLORS[color].hex};"></div>
                <span class="text-[10px] font-medium text-charcoal">${count} ${PRIMARY_COLORS[color].name}</span>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    function ColorTheoryTip({ icon, title, description, color }) {
      return html`
        <div class="tip-card bg-paper border border-linen rounded-2xl p-5">
          <div class="w-10 h-10 rounded-full flex items-center justify-center mb-3" style="background: ${color}15; color: ${color};">
            ${icon}
          </div>
          <h4 class="font-serif text-base font-semibold text-ink mb-1">${title}</h4>
          <p class="text-sm text-charcoal/70 leading-relaxed">${description}</p>
        </div>
      `;
    }

    function App() {
      const [drops, setDrops] = useState({ red: 0, yellow: 0, blue: 0 });
      const [history, setHistory] = useState([]);
      const [isAutoMixing, setIsAutoMixing] = useState(false);

      const mixedColor = mixColors(drops);

      const addDrop = useCallback((color) => {
        setDrops(prev => ({ ...prev, [color]: prev[color] + 1 }));
        setHistory(prev => [...prev.slice(-9), color]);
      }, []);

      const reset = useCallback(() => {
        setDrops({ red: 0, yellow: 0, blue: 0 });
        setHistory([]);
      }, []);

      const autoMix = useCallback(() => {
        if (isAutoMixing) return;
        setIsAutoMixing(true);
        reset();
        
        const sequence = [
          ['red', 800],
          ['yellow', 1600],
          ['blue', 2400],
          ['red', 3200],
          ['yellow', 4000],
        ];
        
        sequence.forEach(([color, delay]) => {
          setTimeout(() => addDrop(color), delay);
        });
        
        setTimeout(() => setIsAutoMixing(false), 5000);
      }, [isAutoMixing, reset, addDrop]);

      const hasDrops = Object.values(drops).some(c => c > 0);

      return html`
        <div class="min-h-screen gradient-mesh grain-overlay relative">
          <${Header} />
          <${Hero} />

          <!-- Main Mixing Area -->
          <div class="max-w-4xl mx-auto px-6 py-8">
            <div class="bg-paper/80 backdrop-blur-sm border border-linen rounded-3xl p-6 sm:p-10 shadow-card">
              
              <!-- Color blobs row -->
              <div class="flex justify-center gap-8 sm:gap-12 mb-10">
                ${Object.entries(PRIMARY_COLORS).map(([key, color], i) => html`
                  <${ColorBlob}
                    key=${key}
                    color=${key}
                    name=${color.name}
                    hex=${color.hex}
                    count=${drops[key]}
                    onClick=${() => addDrop(key)}
                    delay=${i}
                  />
                `)}
              </div>

              <!-- Mixing palette -->
              <div class="flex justify-center mb-8">
                <${MixingPalette} mixedColor=${mixedColor} drops=${drops} onReset=${reset} />
              </div>

              <!-- Auto mix button -->
              <div class="flex justify-center">
                <button
                  onClick=${autoMix}
                  disabled=${isAutoMixing}
                  class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-honey/10 border border-honey/20 text-honey text-sm font-medium hover:bg-honey/20 transition-colors disabled:opacity-50"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 4v6h6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  ${isAutoMixing ? 'Mixing...' : 'Watch a Demo Mix'}
                </button>
              </div>
            </div>
          </div>

          <!-- Color Combinations Guide -->
          <div class="max-w-4xl mx-auto px-6 py-8">
            <div class="text-center mb-8">
              <p class="text-xs uppercase tracking-[0.15em] text-honey font-semibold mb-2">Color Theory</p>
              <h3 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">Secondary Colors</h3>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-paper border border-linen rounded-2xl p-5 text-center">
                <div class="flex justify-center gap-2 mb-3">
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.red.hex};"></div>
                  <span class="text-charcoal/40">+</span>
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.yellow.hex};"></div>
                </div>
                <div class="w-16 h-16 rounded-full mx-auto mb-2 shadow-md" style="background: #FF9800;"></div>
                <p class="font-serif font-semibold text-ink">Orange</p>
              </div>
              
              <div class="bg-paper border border-linen rounded-2xl p-5 text-center">
                <div class="flex justify-center gap-2 mb-3">
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.yellow.hex};"></div>
                  <span class="text-charcoal/40">+</span>
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.blue.hex};"></div>
                </div>
                <div class="w-16 h-16 rounded-full mx-auto mb-2 shadow-md" style="background: #66BB6A;"></div>
                <p class="font-serif font-semibold text-ink">Green</p>
              </div>
              
              <div class="bg-paper border border-linen rounded-2xl p-5 text-center">
                <div class="flex justify-center gap-2 mb-3">
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.red.hex};"></div>
                  <span class="text-charcoal/40">+</span>
                  <div class="w-6 h-6 rounded-full" style="background: ${PRIMARY_COLORS.blue.hex};"></div>
                </div>
                <div class="w-16 h-16 rounded-full mx-auto mb-2 shadow-md" style="background: #AB47BC;"></div>
                <p class="font-serif font-semibold text-ink">Purple</p>
              </div>
            </div>
          </div>

          <!-- Tips Section -->
          <div class="max-w-4xl mx-auto px-6 py-8 pb-16">
            <div class="text-center mb-8">
              <p class="text-xs uppercase tracking-[0.15em] text-honey font-semibold mb-2">Montessori Practice</p>
              <h3 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">In the Prepared Environment</h3>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <${ColorTheoryTip}
                color="#D89A27"
                icon=${html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>`}
                title="Primary First"
                description="Begin with red, yellow, and blue only. Let children discover secondary colors through their own mixing before naming them."
              />
              <${ColorTheoryTip}
                color="#44C9D4"
                icon=${html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`}
                title="Process Over Product"
                description="Focus on the experience of mixing rather than the final color. The journey of discovery matters more than the result."
              />
              <${ColorTheoryTip}
                color="#E91E8F"
                icon=${html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`}
                title="Observation"
                description="Ask open questions: 'What do you notice?' rather than 'What color is that?' Encourage descriptive language."
              />
            </div>
          </div>

          <!-- Footer -->
          <footer class="border-t border-linen bg-canvas/30">
            <div class="max-w-4xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-honey flex items-center justify-center text-white font-serif text-sm font-bold">N</div>
                <span class="font-serif text-sm font-semibold text-ink">Nature of Art</span>
              </div>
              <p class="text-xs text-charcoal/50 text-center">
                A Montessori art education resource. Explore the full curriculum at <a href="https://natureofart.com" class="text-honey hover:underline">natureofart.com</a>
              </p>
            </div>
          </footer>
        </div>
      `;
    }

    // Add ripple keyframe
    const style = document.createElement('style');
    style.textContent = `
      @keyframes ripple {
        to {
          transform: translate(-50%, -50%) scale(20);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    render(html`<${App} />`, document.getElementById('root'));

    // Report height to parent for seamless iframe embedding
    function reportHeight() {
      const height = Math.max(
        document.documentElement.scrollHeight,
        document.documentElement.offsetHeight,
        document.body.scrollHeight,
        document.body.offsetHeight
      );
      if (window.parent !== window) {
        // Add 40px buffer so nothing ever clips
        window.parent.postMessage({ type: 'atelier-resize', height: height + 40 }, '*');
      }
    }
    // Report after render and on resize
    setTimeout(reportHeight, 100);
    setTimeout(reportHeight, 500);
    setTimeout(reportHeight, 1000);
    window.addEventListener('resize', reportHeight);
    // Also observe DOM changes that might affect height
    const observer = new MutationObserver(reportHeight);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>
</html>
